# The CI that `h init` gives projects, run on polygon/ from this very commit:
# a change to the reusable workflow or setup-h is proven before projects pin its SHA.
name: template-check

on:
  pull_request:
    paths:
      - .github/workflows/check.yml
      - .github/workflows/template-check.yml
      - .github/actions/**
      - harness/src/harness/templates/github/harness.yml
  # main saves polygon's caches for the PRs after it (only main writes caches)
  push:
    branches: [main]
    paths:
      - .github/workflows/check.yml
      - .github/workflows/template-check.yml
      - .github/actions/**
      - harness/src/harness/templates/github/harness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push: a group per commit — a pending push run is never replaced by the next push and
  # left unchecked and undeployed; PR runs share one group and cancel the older.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  polygon:
    # what harness.yml grants its check job
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # `$/`: this repository at the running commit (GitHub's self-repository reference).
    uses: $/.github/workflows/check.yml
    with:
      dir: polygon
      full: true
      # the JSON label list and the database step a project on its own runners uses
      runs-on: '["ubuntu-latest"]'
      postgres-image: postgres:18.6
      setup: ci-setup.sh  # polygon/ci-setup.sh: proves the project setup step finds and runs it
