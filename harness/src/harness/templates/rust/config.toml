# .cargo/config.toml — fast linkers (h doctor)
# Linux (CI, prod): mold — `apt install mold clang`, in CI rui314/setup-mold
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Windows: the LLVM linker rustup already ships
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
